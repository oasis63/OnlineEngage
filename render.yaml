        value: 10000
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        value: rediss://default:gQAAAAAAAqq0AAIgcDE2YWIyYWU1ZjUwNTE0NWIwYjAxYjRlYTllYjRmNzJmMw@coherent-locust-174772.upstash.io:6379
      - key: CORS_ORIGIN
        value: "*"
