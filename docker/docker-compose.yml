services:
  redis:
    image: redis:7-alpine
    container_name: anonchat-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: anonchat-coturn
    restart: always
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    network_mode: "host"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: anonchat-server
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: anonchat-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: anonchat-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - server
